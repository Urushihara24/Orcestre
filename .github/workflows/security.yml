name: Security

on:
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Reject tracked runtime env files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            printf 'Tracked runtime environment files are not allowed:\n%s\n' "$bad" >&2
            exit 1
          fi
